# Overrides on top of detekt's default rule set (buildUponDefaultConfig = true).
style:
  MagicNumber:
    excludes: ["**/test/**", "**/testFixtures/**"]
  MaxLineLength:
    maxLineLength: 140
  ReturnCount:
    max: 3
  WildcardImport:
    active: false
complexity:
  LongParameterList:
    constructorThreshold: 10
  TooManyFunctions:
    excludes: ["**/test/**"]
naming:
  FunctionNaming:
    excludes: ["**/test/**"]
performance:
  SpreadOperator:
    active: false
