# Edited only by chains C01/C03. Feature units bind their own @ConfigurationProperties with defaults in code.
# Ruby ENV names are kept (70-security-and-config.md section 11); see README for the full table.
server:
  port: ${PORT:3000}
  shutdown: graceful

spring:
  application:
    name: open-banking-rails-kotlin
  # DATABASE_URL (Rails URL form) overrides these via RailsEnvironmentPostProcessor (config/database.yml:9-32).
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:open_banking_rails_development}
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:postgres}
    hikari:
      maximum-pool-size: ${RAILS_MAX_THREADS:5}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          # Rails writes `timestamp without time zone` columns in UTC wall time, whatever the JVM zone.
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    # Existing Rails databases (33 schema_migrations rows) are marked as V1 instead of re-created (D-005, U-107).
    baseline-on-migrate: true
    baseline-version: 1
    baseline-description: rails schema 2026_05_14_141323
  threads:
    virtual:
      enabled: false

gg:
  jte:
    use-precompiled-templates: true
    development-mode: false

org:
  jobrunr:
    background-job-server:
      enabled: false
    dashboard:
      enabled: false

app:
  force-ssl: ${FORCE_SSL:true}
  secret-key-base: ${SECRET_KEY_BASE:}

logging:
  level:
    root: ${RAILS_LOG_LEVEL:info}
